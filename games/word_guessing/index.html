<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f1ec">
<title>猜词</title>
<style>
    :root {
        --bg: #f3f1ec;
        --card: #fffdf9;
        --ink: #211f1a;
        --ink-btn: #242220;
        --muted: #8d8880;
        --faint: #b3ada3;
        --line: #e7e2d8;
        --soft: #f1ede4;
        --ok: #2f7a54;
        --ok-bg: #e8f2ec;
        --bad: #b4443a;
        --bad-bg: #f7ece9;
        --radius: 18px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    }

    main { width: 100%; max-width: 440px; }

    /* ---------- 通用 ---------- */

    .stack { display: flex; flex-direction: column; gap: 12px; }

    .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 1px 2px rgba(33, 31, 26, .04), 0 12px 32px -22px rgba(33, 31, 26, .45);
    }

    .pad { padding: 16px; }

    .field {
        width: 100%;
        height: 52px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 17px;
        outline: none;
        transition: border-color .18s, box-shadow .18s;
    }
    .field::placeholder { color: var(--faint); }
    .field:focus { border-color: #c9c1b2; box-shadow: 0 0 0 4px rgba(33, 31, 26, .05); }
    .field.code { text-transform: uppercase; letter-spacing: .22em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; }

    .btn {
        height: 52px;
        padding: 0 18px;
        border: 0;
        border-radius: 14px;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform .1s ease, background .18s, opacity .18s;
    }
    .btn:active { transform: scale(.985); }
    .btn.primary { background: var(--ink-btn); color: #fdfbf6; }
    .btn.text { background: transparent; color: var(--muted); font-weight: 500; height: 44px; }
    .btn.wide { width: 100%; }

    .tiny { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
    .center { text-align: center; }
    .msg { font-size: 14px; color: var(--bad); margin: 0 2px; }

    /* ---------- 入口 ---------- */

    .lobby-head { margin: 30px 2px 24px; }
    h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: .12em;
        line-height: 1.1;
    }
    .tagline {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--muted);
        letter-spacing: .16em;
    }

    /* ---------- 顶栏 ---------- */

    .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 2px 0; }

    .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--ink);
        font: 600 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .16em;
        cursor: pointer;
    }
    .chip:active { background: var(--soft); }
    .chip svg { opacity: .45; }

    .net { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
    .net i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #cfc9bd;
        transition: background .25s;
    }
    .net.on i { background: var(--ok); box-shadow: 0 0 0 3px rgba(47, 122, 84, .12); }
    .net.off i { background: var(--bad); }

    /* ---------- 玩家 ---------- */

    .players { display: flex; gap: 16px; padding: 4px 2px 2px; min-height: 60px; }

    .player { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 52px; }

    .avatar {
        position: relative;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--soft);
        color: #6d675d;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 600;
        transition: background .2s, color .2s;
    }
    .player.me .avatar { background: var(--ink); color: #fdfbf6; }

    .pdot {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid var(--bg);
        background: #cfc9bd;
        transition: background .2s;
    }
    .pdot.ok { background: var(--ok); }
    .pdot.off { background: var(--bad); }

    .player .nm {
        max-width: 52px;
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* ---------- 当前轮 ---------- */

    .round-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .round-head .t { font-size: 13px; font-weight: 600; letter-spacing: .1em; color: var(--muted); font-variant-numeric: tabular-nums; }

    .tag {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .04em;
        padding: 4px 9px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }
    .tag.ok { background: var(--ok-bg); color: var(--ok); }

    .room-big {
        display: block;
        width: 100%;
        padding: 20px 0;
        border: 0;
        border-radius: 14px;
        background: var(--soft);
        color: var(--ink);
        font: 700 26px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .24em;
        cursor: pointer;
    }
    .room-big:active { background: #e9e3d6; }

    .compose { display: flex; align-items: center; gap: 10px; }
    .compose .field { flex: 1; }

    .send {
        flex: none;
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 50%;
        background: var(--ink-btn);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform .1s, opacity .2s;
    }
    .send:active { transform: scale(.94); }

    .pending { display: flex; align-items: center; gap: 10px; min-height: 52px; color: var(--muted); font-size: 15px; }
    .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
        animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: .35; transform: scale(.85); }
        50% { opacity: 1; transform: scale(1); }
    }

    .words { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
    .words li { display: flex; align-items: baseline; gap: 12px; padding: 6px 0; }
    .words .n { flex: none; width: 58px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .words .w { font-size: 19px; font-weight: 600; word-break: break-word; }

    .victory { text-align: center; padding: 8px 0 4px; }
    .victory .h { font-size: 21px; font-weight: 700; letter-spacing: .1em; color: var(--ok); }
    .victory .s { margin-top: 6px; font-size: 13px; color: var(--muted); }

    /* ---------- 历史 ---------- */

    .feed { display: flex; flex-direction: column; gap: 10px; }
    .feed .card { padding: 13px 16px; }
    .feed .round-head { margin-bottom: 6px; }
    .feed .card.fresh { animation: rise .3s ease-out; }

    @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
    }

    .entries { display: flex; flex-wrap: wrap; gap: 4px 18px; }
    .entries .e { font-size: 15px; }
    .entries .e b { margin-right: 7px; font-size: 12px; font-weight: 500; color: var(--muted); }

    .sim { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .sim-bar { position: relative; flex: 1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .sim-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #b98329; transition: width .4s ease; }
    .sim-txt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .round-right { display: flex; align-items: center; gap: 8px; }
    .detail-btn { border: 0; background: none; padding: 2px 0; font: inherit; font-size: 11px; color: var(--muted); cursor: pointer; }
    .detail-btn:active { opacity: .6; }

    .matrix { margin-top: 10px; }
    .matrix-cap { font-size: 11px; color: var(--faint); margin-bottom: 6px; }
    .matrix-grid { display: grid; gap: 3px; }
    .mx-head {
        display: block;
        height: 26px;
        line-height: 26px;
        text-align: center;
        font-size: 11px;
        color: var(--muted);
        min-width: 0;
        padding: 0 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .mx-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        border-radius: 7px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        background: var(--soft);
        color: var(--muted);
    }

    /* ---------- 总结图 ---------- */

    .share {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: calc(20px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
        background: rgba(20, 18, 15, .74);
        overflow: auto;
    }
    .share-box { width: 100%; max-width: 520px; }
    .share-box img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 14px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
    }
    .share-hint { margin: 14px 0 12px; text-align: center; font-size: 13px; color: #f1ece2; }
    .share-btns { display: flex; gap: 10px; }
    .share-btns .btn { flex: 1; }

    /* ---------- 底部 ---------- */

    .foot { display: flex; align-items: center; gap: 16px; padding: 2px 2px 8px; }
    .foot .grow { flex: 1; }
    .link { border: 0; background: none; padding: 6px 0; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; }
    .link.warn { color: var(--bad); }

    /* ---------- 提示 ---------- */

    .toast {
        position: fixed;
        left: 50%;
        bottom: calc(32px + env(safe-area-inset-bottom));
        transform: translate(-50%, 8px);
        padding: 9px 15px;
        border-radius: 10px;
        background: rgba(33, 31, 26, .94);
        color: #fdfbf6;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s, transform .2s;
        z-index: 20;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .boot { margin: 80px 0; text-align: center; color: var(--bad); font-size: 14px; }

    /* 显隐统一规则，放在最后：作者样式里的 display:flex 会盖掉浏览器给 [hidden] 的 display:none */
    [hidden] { display: none !important; }
    .hide { display: none !important; }
</style>
</head>
<body>
<main>
    <section id="lobby">
        <div class="lobby-head">
            <h1>猜词</h1>
            <p class="tagline">写出同一个词</p>
        </div>

        <div class="card pad stack">
            <input id="name" class="field" type="text" maxlength="8" placeholder="昵称（留空随机）" autocomplete="nickname">
            <button id="create" class="btn primary">创建房间</button>
            <button id="joinToggle" class="btn text">加入房间</button>
        </div>

        <div id="joinBox" class="card pad stack" hidden style="margin-top:12px">
            <input id="code" class="field code" type="text" maxlength="6" placeholder="房间码" autocapitalize="characters" autocomplete="off" spellcheck="false">
            <button id="joinGo" class="btn primary">进入</button>
        </div>

        <p id="lobbyMsg" class="msg" style="margin-top:14px" hidden></p>
    </section>

    <section id="game" class="stack" hidden>
        <div class="bar">
            <button id="roomChip" class="chip" aria-label="复制邀请链接">
                <span id="roomCode"></span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
            <div class="net" id="net"><i></i><span id="netText">连接中</span></div>
        </div>

        <div class="players" id="players"></div>

        <article class="card pad round" id="currentCard">
            <div class="round-head">
                <span class="t" id="currentRound">第 1 轮</span>
                <span class="tag" id="currentTag">等待</span>
            </div>

            <div id="waitingBody" hidden>
                <button class="room-big" id="roomChip2"><span id="roomCode2"></span></button>
                <p class="tiny center">点一下复制邀请</p>
            </div>

            <div id="composeBody" hidden>
                <form id="compose" class="compose">
                    <input id="word" class="field" type="text" maxlength="16" placeholder="写一个词…" autocomplete="off" enterkeyhint="send">
                    <button class="send" type="submit" aria-label="提交">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
                    </button>
                </form>
            </div>

            <div id="pendingBody" class="pending" hidden>
                <span class="pulse"></span>
                <span id="pendingText">已提交</span>
            </div>

            <div id="doneBody" hidden>
                <ul class="words" id="doneWords"></ul>
                <div class="victory">
                    <div class="h">全员一致</div>
                    <div class="s" id="victorySub"></div>
                </div>
                <button id="againBtn" class="btn primary wide" style="margin-top:16px">再来一局</button>
                <button id="summaryBtn" class="btn ghost wide" style="margin-top:10px" hidden>生成总结图</button>
            </div>
        </article>

        <div class="feed" id="feed"></div>

        <div class="foot">
            <button id="exitBtn" class="link">退出</button>
            <span class="grow"></span>
            <button id="takeoverBtn" class="link warn" hidden>接管房主</button>
        </div>
    </section>

    <div id="boot" class="boot" hidden></div>
</main>

<div id="share" class="share" hidden>
    <div class="share-box">
        <img id="shareImg" alt="对局总结图">
        <p class="share-hint">长按图片保存到相册</p>
        <div class="share-btns">
            <button id="shareSave" class="btn ghost">下载</button>
            <button id="shareClose" class="btn primary">关闭</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="mqtt.min.js"></script>
<script src="room.js"></script>
<script>
(function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };
    var R = window.WGRoom;

    if (!window.mqtt || !R) {
        var miss = [];
        if (!window.mqtt) miss.push('mqtt.min.js');
        if (!R) miss.push('room.js');
        show('boot', true);
        $('boot').textContent = '加载失败：' + miss.join('、') + '，请刷新重试';
        show('lobby', false);
        return;
    }

    var BROKERS = ['wss://broker-cn.emqx.io:8084/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
    var TOPIC = 'whim/wg/v1/';
    var HOST_SILENT_MS = 18000;
    var HELLO_RETRY_MS = 2500;
    var PING_MS = 6000;
    var HOST_TICK_MS = 5000;
    var SUBMIT_TIMEOUT_MS = 3000;

    var me = { id: '', name: '' };
    var room = '';
    var isHost = false;
    var st = null;
    var client = null;
    var brokerIdx = 0;
    var lastHeard = 0;
    var helloCount = 0;
    var pendingWord = null;
    var pendingRound = 0;
    var pendingAt = 0;
    var lastFeedRound = 0;
    var triedFallback = false;
    var timers = { hello: null, ping: null, host: null, submit: null, tick: null };

    // ---------- 基础 ----------

    function randCode(n) {
        var abc = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
        var out = '';
        var buf = new Uint32Array(n);
        (window.crypto || window.msCrypto).getRandomValues(buf);
        for (var i = 0; i < n; i++) out += abc[buf[i] % abc.length];
        return out;
    }

    function myId() {
        try {
            var v = sessionStorage.getItem('wg.id');
            if (v) return v;
        } catch (e) { /* ignore */ }
        var id = randCode(10).toLowerCase();
        try { sessionStorage.setItem('wg.id', id); } catch (e) { /* ignore */ }
        return id;
    }

    function savedName() {
        try { return localStorage.getItem('wg.name') || ''; } catch (e) { return ''; }
    }

    function saveName(name) {
        try { localStorage.setItem('wg.name', name); } catch (e) { /* ignore */ }
    }

    function setNet(text, state) {
        var net = $('net');
        net.className = 'net' + (state ? ' ' + state : '');
        $('netText').textContent = text;
    }

    // 显隐统一入口：hidden 属性管首帧，.hide 类管运行期（!important，不会被 display:flex 盖掉）
    function show(el, on) {
        if (typeof el === 'string') el = $(el);
        el.hidden = !on;
        el.classList.toggle('hide', !on);
    }

    function publish(msg, retain) {
        if (!client || !client.connected) return false;
        msg.room = room;
        client.publish(TOPIC + room, JSON.stringify(msg), { qos: 0, retain: !!retain });
        return true;
    }

    var toastTimer = null;
    function toast(text) {
        var el = $('toast');
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
    }

    // ---------- 启动 ----------

    function boot() {
        me.id = myId();
        me.name = savedName();
        $('name').value = me.name;

        bind();
        timers.tick = setInterval(tickUi, 1000);

        var qr = (new URLSearchParams(location.search).get('r') || '').toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 6);
        if (qr) {
            room = qr;
            $('code').value = qr;
            show('joinBox', true);
            if (me.name) { startSession(false); return; }
            showLobbyMsg('加入房间 ' + qr);
        }
    }

    function showLobbyMsg(text) {
        var el = $('lobbyMsg');
        el.textContent = text;
        show(el, !!text);
    }

    function bind() {
        $('create').onclick = function () {
            room = randCode(6);
            startSession(true);
        };
        $('joinToggle').onclick = function () {
            var open = $('joinBox').hidden;
            show('joinBox', open);
            if (open) $('code').focus();
        };
        $('joinGo').onclick = function () {
            var code = ($('code').value || '').toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 6);
            if (code.length !== 6) { showLobbyMsg('房间码是 6 位'); return; }
            room = code;
            startSession(false);
        };
        $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('joinGo').click(); });
        $('name').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('create').click(); });

        $('compose').addEventListener('submit', function (e) { e.preventDefault(); submitWord(); });
        $('againBtn').onclick = function () { if (isHost) restartGame(); else publish({ t: 'restart', id: me.id }); };
        $('summaryBtn').onclick = function () {
            if (SIM.state !== 'ready') {
                if (SIM.state === 'idle') loadSim();
                toast('词表还在加载，稍等一下');
                return;
            }
            var url = buildSummary();
            if (!url) { toast('生成失败'); return; }
            $('shareImg').src = url;
            show('share', true);
        };
        $('shareClose').onclick = function () { show('share', false); };
        $('shareSave').onclick = function () {
            var a = document.createElement('a');
            a.href = $('shareImg').src;
            a.download = '猜词-' + room + '.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
        };
        $('share').addEventListener('click', function (e) {
            if (e.target === $('share')) show('share', false);
        });
        $('roomChip').onclick = copyInvite;
        $('roomChip2').onclick = copyInvite;
        $('exitBtn').onclick = exit;
        $('takeoverBtn').onclick = takeOver;

        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState !== 'visible') return;
            if (client && !client.connected) client.reconnect();
            if (!isHost && st && Date.now() - lastHeard > 10000) hello();
        });
    }

    // ---------- 会话 ----------

    function startSession(asHost) {
        isHost = asHost;
        var typed = ($('name').value || '').trim().slice(0, 8);
        me.name = typed;                 // 留空则交给房主分配北斗星名
        if (typed) saveName(typed);
        pendingWord = null;
        lastFeedRound = 0;

        history.replaceState(null, '', location.pathname + '?r=' + room);

        show('lobby', false);
        show('game', true);

        if (isHost) {
            st = R.createState(room, me.id, me.name);
            lastHeard = Date.now();
        }
        render();
        connect();
        if (!isHost) startHelloLoop();
        startPingLoop();
    }

    function connect() {
        stopClient();
        var url = BROKERS[brokerIdx % BROKERS.length];
        setNet('连接中');
        client = mqtt.connect(url, {
            clientId: 'wg-' + me.id + '-' + randCode(4).toLowerCase(),
            keepalive: 30,
            clean: true,
            protocolVersion: 4,
            connectTimeout: 8000,
            reconnectPeriod: 3000
        });

        client.on('connect', function () {
            setNet('已连接', 'on');
            triedFallback = false;
            client.subscribe(TOPIC + room, { qos: 0 }, function (err) {
                if (err) { setNet('订阅失败', 'off'); return; }
                if (isHost) { publishState(); startHostLoop(); }
                else hello();
            });
        });
        client.on('message', onMessage);
        client.on('reconnect', function () { setNet('重连中', 'off'); });
        client.on('close', function () { setNet('已断开', 'off'); });
        client.on('error', function () {
            setNet('网络异常', 'off');
            if (triedFallback) return;
            triedFallback = true;
            setTimeout(function () { brokerIdx += 1; connect(); }, 1500);
        });
    }

    function stopClient() {
        if (client) {
            try { client.end(true); } catch (e) { /* ignore */ }
            client = null;
        }
    }

    function onMessage(topic, buf) {
        var msg;
        try { msg = JSON.parse(buf.toString()); } catch (e) { return; }
        if (!msg || msg.room !== room) return;

        if (msg.t === 'state') { adopt(msg.s); return; }
        if (msg.t === 'full') {
            if (msg.to === me.id) {
                showLobbyMsg('房间已满（最多 4 人）');
                leaveToLobby();
            }
            return;
        }
        if (isHost && st) hostApply(msg);
    }

    function adopt(s) {
        if (!s || s.room !== room) return;
        if (s.updatedAt && Date.now() - s.updatedAt > 30 * 60 * 1000) return;
        if (!R.isNewer(st, s)) return;

        var wasHost = isHost;
        st = s;
        lastHeard = Date.now();
        isHost = (s.hostId === me.id);

        if (isHost && !wasHost) startHostLoop();
        if (!isHost && wasHost) stopHostLoop();
        if (!R.find(s, me.id)) hello();

        // 自己的提交已经被房主确认（或本轮已经过去），清掉本地待确认状态
        if (pendingWord) {
            var mine = R.find(s, me.id);
            if (!mine || mine.wordRound === s.round || s.round !== pendingRound) {
                pendingWord = null;
                clearTimeout(timers.submit);
            }
        }

        render();
    }

    function hostApply(msg) {
        var r = R.hostHandle(st, msg, Date.now());
        r.out.forEach(function (m) { publish(m, false); });
        if (r.changed) publishState();
    }

    function publishState() {
        if (!isHost || !st) return;
        R.refresh(st, Date.now());
        publish({ t: 'state', s: st, id: me.id }, true);
        lastHeard = Date.now();
        render();
    }

    function hello() {
        helloCount += 1;
        publish({ t: 'hello', id: me.id, name: me.name }, false);
        if (helloCount > 8 && !st) setNet('没找到房间', 'off');
    }

    function startHelloLoop() {
        clearInterval(timers.hello);
        helloCount = 0;
        timers.hello = setInterval(function () {
            if (isHost) { clearInterval(timers.hello); return; }
            if (st && R.find(st, me.id)) { clearInterval(timers.hello); return; }
            hello();
        }, HELLO_RETRY_MS);
    }

    function startPingLoop() {
        clearInterval(timers.ping);
        timers.ping = setInterval(function () {
            if (!isHost) publish({ t: 'ping', id: me.id, name: me.name }, false);
        }, PING_MS);
    }

    function startHostLoop() {
        clearInterval(timers.host);
        timers.host = setInterval(function () {
            if (!isHost || !st) return;
            publishState();
        }, HOST_TICK_MS);
    }

    function stopHostLoop() {
        clearInterval(timers.host);
        timers.host = null;
    }

    function restartGame() {
        if (!isHost || !st) return;
        var r = R.hostHandle(st, { t: 'restart', id: me.id }, Date.now());
        if (r.changed) publishState();
    }

    function takeOver() {
        if (!st) return;
        isHost = true;
        if (!R.find(st, me.id)) R.addPlayer(st, me.id, me.name, Date.now());
        st.hostId = me.id;
        st.seq += 1;
        st.updatedAt = Date.now();
        publishState();
        startHostLoop();
    }

    // ---------- 提交 ----------

    function submitWord() {
        var el = $('word');
        var w = (el.value || '').replace(/\s+/g, ' ').trim().slice(0, R.MAX_WORD);
        if (!w || !st || st.phase !== 'playing') return;
        if (pendingWord) return;

        var mine = R.find(st, me.id);
        if (!mine) { hello(); return; }
        if (mine.wordRound === st.round) return;

        el.value = '';

        if (isHost) {
            var r = R.hostHandle(st, { t: 'submit', id: me.id, word: w }, Date.now());
            if (r.changed) publishState();
            return;
        }

        pendingWord = w;
        pendingRound = st.round;
        pendingAt = Date.now();
        render();
        publish({ t: 'submit', id: me.id, word: w }, false);

        clearTimeout(timers.submit);
        timers.submit = setTimeout(function () {
            if (!pendingWord) return;
            pendingWord = null;
            toast('没提交上，再试一次');
            render();
        }, SUBMIT_TIMEOUT_MS);
    }

    // ---------- 渲染 ----------

    function submitted(p) { return p.wordRound === st.round && !!p.word; }

    // ---------- 词语接近度（离线词向量表，首次用到时才加载） ----------

    var SIM = { state: 'idle', words: null, q: null, dim: 0, scale: 1, index: null };

    function loadSim() {
        if (SIM.state !== 'idle') return;
        SIM.state = 'loading';
        if (typeof fetch !== 'function') { SIM.state = 'failed'; return; }
        Promise.all([
            fetch('words.txt').then(function (r) { return r.text(); }),
            fetch('meta.json').then(function (r) { return r.json(); }),
            fetch('vectors.bin').then(function (r) { return r.arrayBuffer(); })
        ]).then(function (res) {
            var words = res[0].split('\n');
            SIM.words = words;
            SIM.dim = res[1].dim;
            SIM.scale = res[1].scale;
            SIM.q = new Int8Array(res[2]);
            var m = new Map();
            for (var i = 0; i < words.length; i++) m.set(words[i], i);
            SIM.index = m;
            SIM.state = 'ready';
            render();
        }).catch(function () { SIM.state = 'failed'; });
    }

    // 余弦 -> 0-100：中间值 0.26、斜率 0.085，让随机词对落在 5% 左右
    function mapCos(c) {
        var p = 100 / (1 + Math.exp(-(c - 0.26) / 0.085));
        return Math.max(1, Math.min(99, Math.round(p)));
    }

    // 词表外的词：只按字面重合给分，上限 60，避免和语义分混淆
    function charSim(a, b) {
        var A = Array.from(a), B = Array.from(b);
        var set = {};
        B.forEach(function (c) { set[c] = true; });
        var inter = A.filter(function (c) { return set[c]; }).length;
        if (!inter) return 0;
        return Math.round((2 * inter / (A.length + B.length)) * 60);
    }

    function pairSim(a, b) {
        if (a.word === b.word) return 100;
        if (SIM.state !== 'ready') return null;
        var i = SIM.index.get(a.word), j = SIM.index.get(b.word);
        if (i === undefined || j === undefined) return charSim(a.word, b.word);
        var d = SIM.dim, q = SIM.q, s = 0, na = 0, nb = 0;
        for (var k = 0; k < d; k++) {
            var x = q[i * d + k], y = q[j * d + k];
            s += x * y; na += x * x; nb += y * y;
        }
        if (!na || !nb) return charSim(a.word, b.word);
        return mapCos(s / Math.sqrt(na * nb));
    }

    // 返回 { avg, best, bestPair }；表格没就绪时返回 null
    function roundSim(rec) {
        var es = rec.entries;
        if (es.length < 2 || SIM.state !== 'ready') return null;
        var total = 0, n = 0, best = -1, bestPair = null;
        for (var i = 0; i < es.length; i++) {
            for (var j = i + 1; j < es.length; j++) {
                var p = pairSim(es[i], es[j]);
                if (p === null) return null;
                total += p; n++;
                if (p > best) { best = p; bestPair = [es[i], es[j]]; }
            }
        }
        return { avg: Math.round(total / n), best: best, bestPair: bestPair, pairs: n };
    }

    function simRow(rec) {
        var el = document.createElement('div');
        el.className = 'sim';

        var r = roundSim(rec);
        if (!r) {
            if (SIM.state !== 'failed') loadSim();
            return null;
        }

        var bar = document.createElement('span');
        bar.className = 'sim-bar';
        var fill = document.createElement('i');
        fill.style.width = r.avg + '%';
        bar.appendChild(fill);

        var txt = document.createElement('span');
        txt.className = 'sim-txt';
        txt.textContent = r.pairs === 1
            ? '接近度 ' + r.avg + '%'
            : '平均 ' + r.avg + '% · 最高 ' + r.best + '%';

        el.appendChild(bar);
        el.appendChild(txt);
        return el;
    }

    // ---------- 本轮 × 上一轮 的详细矩阵 ----------

    var expanded = {};

    // 低分冷灰 -> 中分沙色 -> 高分赭金
    var HEAT = [[238, 241, 245], [236, 214, 178], [176, 116, 44]];

    function heat(v) {
        var t = Math.max(0, Math.min(1, v / 100));
        var a = t < 0.5 ? HEAT[0] : HEAT[1];
        var b = t < 0.5 ? HEAT[1] : HEAT[2];
        var k = t < 0.5 ? t / 0.5 : (t - 0.5) / 0.5;
        var rgb = a.map(function (x, i) { return Math.round(x + (b[i] - x) * k); });
        var lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
        return { bg: 'rgb(' + rgb.join(',') + ')', fg: lum < 0.55 ? '#fff' : '#211f1a' };
    }

    function mxEl(cls, text) {
        var el = document.createElement('span');
        el.className = cls;
        el.textContent = text;
        return el;
    }

    function recOf(round) {
        for (var i = 0; i < st.history.length; i++) {
            if (st.history[i].round === round) return st.history[i];
        }
        return null;
    }

    function buildMatrix(cur, prev) {
        var wrap = document.createElement('div');
        wrap.className = 'matrix';

        var grid = document.createElement('div');
        grid.className = 'matrix-grid';
        grid.style.gridTemplateColumns = '46px repeat(' + prev.entries.length + ', minmax(0, 1fr))';

        grid.appendChild(mxEl('mx-head', ''));
        prev.entries.forEach(function (e) {
            var h = mxEl('mx-head', e.word);
            h.title = e.name + '：' + e.word;
            grid.appendChild(h);
        });

        cur.entries.forEach(function (row) {
            var rh = mxEl('mx-head', row.word);
            rh.title = row.name + '：' + row.word;
            grid.appendChild(rh);
            prev.entries.forEach(function (col) {
                var v = pairSim(row, col);
                var cell = mxEl('mx-cell', v === null ? '…' : String(v));
                if (v !== null) {
                    var c = heat(v);
                    cell.style.background = c.bg;
                    cell.style.color = c.fg;
                }
                grid.appendChild(cell);
            });
        });

        if (SIM.state !== 'ready' && SIM.state !== 'failed') loadSim();
        wrap.appendChild(grid);
        return wrap;
    }

    // ---------- 对局总结图 ----------

    var FONT = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';

    function today() {
        var d = new Date();
        var m = d.getMonth() + 1, day = d.getDate();
        return d.getFullYear() + '.' + (m < 10 ? '0' : '') + m + '.' + (day < 10 ? '0' : '') + day;
    }

    // 我的「上一轮 -> 这一轮」
    function selfSeries() {
        var mine = [];
        st.history.forEach(function (rec) {
            for (var i = 0; i < rec.entries.length; i++) {
                if (rec.entries[i].id === me.id) {
                    mine.push({ round: rec.round, word: rec.entries[i].word });
                    break;
                }
            }
        });
        var out = [];
        for (var i = 1; i < mine.length; i++) {
            var v = pairSim({ word: mine[i - 1].word }, { word: mine[i].word });
            if (v === null) return out;
            out.push({ round: mine[i].round, a: mine[i - 1].word, b: mine[i].word, v: v });
        }
        return out;
    }

    // 每一轮全员两两的平均
    function avgSeries() {
        var out = [];
        st.history.forEach(function (rec) {
            if (rec.entries.length < 2) return;
            var total = 0, n = 0;
            for (var i = 0; i < rec.entries.length; i++) {
                for (var j = i + 1; j < rec.entries.length; j++) {
                    var v = pairSim(rec.entries[i], rec.entries[j]);
                    if (v === null) return;
                    total += v;
                    n++;
                }
            }
            out.push({ round: rec.round, v: Math.round(total / n) });
        });
        return out;
    }

    function rrPath(g, x, y, w, h, r) {
        if (g.roundRect) {
            g.beginPath();
            g.roundRect(x, y, w, h, r);
            return;
        }
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
    }

    function fitText(g, s, maxW) {
        if (g.measureText(s).width <= maxW) return s;
        var out = s;
        while (out.length > 1 && g.measureText(out + '…').width > maxW) out = out.slice(0, -1);
        return out + '…';
    }

    function drawChart(g, box, pts, opt) {
        var card = '#fffdf9', gold = '#b98329', ink = '#211f1a', muted = '#8d8880';
        var n = pts.length;

        if (!n) {
            g.fillStyle = '#b3ada3';
            g.font = '26px ' + FONT;
            g.textAlign = 'center';
            g.textBaseline = 'middle';
            g.fillText('还不够两轮', box.x + box.w / 2, box.y + box.h / 2);
            return;
        }

        var padX = n === 1 ? 0 : 40;
        var xs = [];
        for (var i = 0; i < n; i++) {
            xs.push(n === 1 ? box.x + box.w / 2 : box.x + padX + (box.w - padX * 2) * i / (n - 1));
        }
        function yOf(v) { return box.y + box.h - (v / 100) * box.h; }

        var spacing = n > 1 ? xs[1] - xs[0] : box.w;
        var labelFont = Math.max(15, Math.min(23, spacing / 7));
        var valueFont = Math.max(20, Math.min(30, spacing / 3));

        [0, 25, 50, 75, 100].forEach(function (v) {
            var y = yOf(v);
            g.strokeStyle = '#efeae0';
            g.lineWidth = 2;
            g.beginPath();
            g.moveTo(box.x, y);
            g.lineTo(box.x + box.w, y);
            g.stroke();
            g.fillStyle = '#b3ada3';
            g.font = '22px ' + FONT;
            g.textAlign = 'right';
            g.textBaseline = 'middle';
            g.fillText(String(v), box.x - 16, y);
        });

        g.strokeStyle = gold;
        g.lineWidth = 5;
        g.lineJoin = 'round';
        g.lineCap = 'round';
        g.beginPath();
        for (i = 0; i < n; i++) {
            if (i === 0) g.moveTo(xs[i], yOf(pts[i].v));
            else g.lineTo(xs[i], yOf(pts[i].v));
        }
        g.stroke();

        for (i = 0; i < n; i++) {
            var x = xs[i], y = yOf(pts[i].v);
            g.beginPath();
            g.arc(x, y, 10, 0, Math.PI * 2);
            g.fillStyle = card;
            g.fill();
            g.lineWidth = 5;
            g.strokeStyle = gold;
            g.stroke();

            g.fillStyle = ink;
            g.font = 'bold ' + valueFont + 'px ' + FONT;
            g.textAlign = 'center';
            if (pts[i].v > 86) {
                g.textBaseline = 'top';
                g.fillText(pts[i].v + '%', x, y + 20);
            } else {
                g.textBaseline = 'bottom';
                g.fillText(pts[i].v + '%', x, y - 20);
            }
        }

        if (opt.labels) {
            for (i = 0; i < n; i++) {
                g.fillStyle = muted;
                g.font = labelFont + 'px ' + FONT;
                g.textAlign = 'center';
                g.textBaseline = 'top';
                g.fillText(fitText(g, pts[i].a + ' → ' + pts[i].b, spacing - 10), xs[i], box.y + box.h + 26);
            }
        }
        for (i = 0; i < n; i++) {
            g.fillStyle = '#b3ada3';
            g.font = '20px ' + FONT;
            g.textAlign = 'center';
            g.textBaseline = 'top';
            g.fillText('第 ' + pts[i].round + ' 轮', xs[i], box.y + box.h + (opt.labels ? 62 : 26));
        }
    }

    function buildSummary() {
        var W = 1080, H = 1680;
        var cv = document.createElement('canvas');
        cv.width = W;
        cv.height = H;
        var g = cv.getContext('2d');
        if (!g) return null;

        var ink = '#211f1a', muted = '#8d8880', line = '#e7e2d8', card = '#fffdf9', paper = '#f7f4ee';

        g.fillStyle = paper;
        g.fillRect(0, 0, W, H);

        g.textAlign = 'left';
        g.textBaseline = 'alphabetic';
        g.fillStyle = muted;
        g.font = '28px ' + FONT;
        g.fillText('猜词', 88, 108);

        g.fillStyle = ink;
        g.font = 'bold 58px ' + FONT;
        g.fillText('第 ' + st.round + ' 轮 · 全员一致', 88, 188);

        g.fillStyle = muted;
        g.font = '24px ' + FONT;
        g.fillText(today() + ' · 房间 ' + room + ' · ' + st.players.length + ' 人', 88, 234);

        function panel(y, h, title) {
            rrPath(g, 48, y, W - 96, h, 28);
            g.fillStyle = card;
            g.fill();
            g.strokeStyle = line;
            g.lineWidth = 2;
            g.stroke();
            g.fillStyle = ink;
            g.font = 'bold 34px ' + FONT;
            g.textAlign = 'left';
            g.textBaseline = 'alphabetic';
            g.fillText(title, 88, y + 66);
        }

        panel(280, 620, '我的上一轮 → 这一轮');
        drawChart(g, { x: 150, y: 380, w: 842, h: 340 }, selfSeries(), { labels: true });

        panel(940, 560, '每轮全员平均');
        drawChart(g, { x: 150, y: 1040, w: 842, h: 340 }, avgSeries(), { labels: false });

        g.fillStyle = '#b3ada3';
        g.font = '22px ' + FONT;
        g.textAlign = 'center';
        g.textBaseline = 'alphabetic';
        g.fillText('word-guessing · ' + today(), W / 2, 1600);

        try {
            return cv.toDataURL('image/png');
        } catch (e) {
            return null;
        }
    }

    // 北斗星名取第二个字（枢/璇/玑/权/衡/阳/光），否则取首字
    function avatarChar(name) {
        if (!name) return '?';
        var chars = Array.from(name);
        if (R.STARS.indexOf(name) >= 0 && chars.length > 1) return chars[1].toUpperCase();
        return chars[0].toUpperCase();
    }

    function render() {
        if (!st) return;
        $('roomCode').textContent = room;
        renderPlayers();
        renderCurrent();
        renderFeed();
        if (st.phase !== 'done') show('share', false);
    }

    function renderPlayers() {
        var wrap = $('players');
        var frag = document.createDocumentFragment();
        st.players.forEach(function (p) {
            var el = document.createElement('div');
            el.className = 'player' + (p.id === me.id ? ' me' : '');

            var av = document.createElement('div');
            av.className = 'avatar';
            av.textContent = avatarChar(p.name);

            var dot = document.createElement('i');
            dot.className = 'pdot';
            if (st.phase !== 'done' && Date.now() - p.lastSeen > 20000) dot.className += ' off';
            else if (submitted(p)) dot.className += ' ok';

            var nm = document.createElement('span');
            nm.className = 'nm';
            nm.textContent = p.id === me.id ? p.name + '·我' : p.name;

            av.appendChild(dot);
            el.appendChild(av);
            el.appendChild(nm);
            frag.appendChild(el);
        });
        wrap.innerHTML = '';
        wrap.appendChild(frag);
    }

    function setBody(id) {
        ['waitingBody', 'composeBody', 'pendingBody', 'doneBody'].forEach(function (k) {
            show(k, k === id);
        });
    }

    function fillWords(ul, entries) {
        ul.innerHTML = '';
        entries.forEach(function (e) {
            var li = document.createElement('li');
            var n = document.createElement('span');
            n.className = 'n';
            n.textContent = e.id === me.id ? '我' : e.name;
            var w = document.createElement('span');
            w.className = 'w';
            w.textContent = e.word;
            li.appendChild(n);
            li.appendChild(w);
            ul.appendChild(li);
        });
    }

    function renderCurrent() {
        var tag = $('currentTag');
        tag.className = 'tag';
        $('currentRound').textContent = '第 ' + st.round + ' 轮';

        var total = st.players.length;
        var got = st.players.filter(submitted).length;
        var mine = R.find(st, me.id);

        if (st.phase === 'waiting') {
            tag.textContent = total + ' 人';
            $('roomCode2').textContent = room;
            setBody('waitingBody');
            return;
        }

        if (st.phase === 'playing') {
            tag.textContent = got + '/' + total;
            var confirmed = !!(mine && submitted(mine));
            if (confirmed || pendingWord) {
                $('pendingText').textContent = '已提交，等待其他人';
                setBody('pendingBody');
            } else {
                setBody('composeBody');
            }
            return;
        }

        var rec = R.lastRecord(st);
        if (rec) {
            tag.textContent = '一致';
            tag.className = 'tag ok';
            fillWords($('doneWords'), rec.entries);
            $('victorySub').textContent = '第 ' + st.round + ' 轮 · ' + rec.entries.length + ' 人想到了一起';
            show('summaryBtn', st.history.length >= 2);
            setBody('doneBody');
        }
    }

    function renderFeed() {
        var feed = $('feed');
        feed.innerHTML = '';

        if (!st.history.length) expanded = {};   // 重开一局时清掉展开状态

        var newest = st.round - 1;
        var animate = newest > lastFeedRound;

        for (var r = newest; r >= 1; r--) {
            var rec = recOf(r);
            if (!rec) continue;
            var prev = recOf(r - 1);

            var card = document.createElement('article');
            card.className = 'card' + (animate && r === newest ? ' fresh' : '');

            var head = document.createElement('div');
            head.className = 'round-head';
            var t = document.createElement('span');
            t.className = 't';
            t.textContent = '第 ' + r + ' 轮';

            var right = document.createElement('div');
            right.className = 'round-right';

            var tag = document.createElement('span');
            tag.className = 'tag ' + (rec.unanimous ? 'ok' : '');
            tag.textContent = rec.unanimous ? '一致' : '不一致';
            right.appendChild(tag);

            if (prev) {
                var btn = document.createElement('button');
                btn.className = 'detail-btn';
                btn.textContent = expanded[r] ? '收起' : '详细';
                btn.setAttribute('aria-label', '第 ' + r + ' 轮与上一轮的相似度矩阵');
                btn.addEventListener('click', (function (round) {
                    return function () { expanded[round] = !expanded[round]; render(); };
                })(r));
                right.appendChild(btn);
            }

            head.appendChild(t);
            head.appendChild(right);

            var entries = document.createElement('div');
            entries.className = 'entries';
            rec.entries.forEach(function (e) {
                var s = document.createElement('span');
                s.className = 'e';
                var b = document.createElement('b');
                b.textContent = e.id === me.id ? '我' : e.name;
                s.appendChild(b);
                s.appendChild(document.createTextNode(e.word));
                entries.appendChild(s);
            });

            card.appendChild(head);
            card.appendChild(entries);
            var sim = simRow(rec);
            if (sim) card.appendChild(sim);
            if (prev && expanded[r]) card.appendChild(buildMatrix(rec, prev));
            feed.appendChild(card);
        }

        lastFeedRound = newest;
    }

    function tickUi() {
        if (!st) return;

        if (pendingWord && Date.now() - pendingAt > SUBMIT_TIMEOUT_MS) {
            pendingWord = null;
            toast('没提交上，再试一次');
            render();
        }

        var silent = !isHost && Date.now() - lastHeard > HOST_SILENT_MS;
        show('takeoverBtn', silent);
    }

    // ---------- 邀请 / 退出 ----------

    function copyInvite() {
        var url = location.origin + location.pathname + '?r=' + room;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function () { toast('已复制'); },
                function () { window.prompt('复制链接', url); });
        } else {
            window.prompt('复制链接', url);
        }
    }

    function exit() {
        publish({ t: 'bye', id: me.id }, false);
        setTimeout(function () {
            stopClient();
            leaveToLobby();
        }, 120);
    }

    function leaveToLobby() {
        stopClient();
        clearInterval(timers.hello);
        clearInterval(timers.ping);
        clearInterval(timers.host);
        clearTimeout(timers.submit);
        st = null;
        isHost = false;
        pendingWord = null;
        show('game', false);
        show('lobby', true);
        $('name').value = savedName();
        history.replaceState(null, '', location.pathname);
    }

    boot();
})();
</script>
</body>
</html>
